openapi: 3.0.3
info:
  title: Book Management API
  version: 1.0.0
  description: >
    API mẫu quản lý sách. Đặc tả này mô tả contract giữa client và server.
    Backend mẫu được triển khai bằng Flask.
servers:
  - url: http://127.0.0.1:5000
    description: Local development server

tags:
  - name: Books
    description: Các thao tác quản lý sách

paths:
  /books:
    get:
      tags: [Books]
      summary: Lấy danh sách sách
      operationId: listBooks
      responses:
        '200':
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
              example:
                data:
                  - id: 1
                    title: Clean Code
                    author: Robert C. Martin
                    published_year: 2008
                total: 1
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Books]
      summary: Tạo sách mới
      operationId: createBook
      requestBody:
        required: true
        description: Thông tin sách mới; ID do server tự cấp.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
            example:
              title: Clean Code
              author: Robert C. Martin
              published_year: 2008
      responses:
        '201':
          description: Tạo sách thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          description: Content-Type không phải application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/BookId'

    get:
      tags: [Books]
      summary: Lấy thông tin một cuốn sách
      operationId: getBook
      responses:
        '200':
          description: Tìm thấy sách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Books]
      summary: Cập nhật toàn bộ thông tin có thể sửa của sách
      description: PUT yêu cầu gửi đủ title, author và published_year.
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
            example:
              title: Clean Code - Second Edition
              author: Robert C. Martin
              published_year: 2009
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          description: Content-Type không phải application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Books]
      summary: Xóa sách
      operationId: deleteBook
      responses:
        '204':
          description: Xóa thành công; không có response body
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: ID của sách cần thao tác
      schema:
        type: integer
        minimum: 1
      example: 1

  schemas:
    Book:
      type: object
      description: Thông tin đầy đủ của một cuốn sách.
      required:
        - id
        - title
        - author
        - published_year
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        title:
          type: string
          minLength: 1
          example: Clean Code
        author:
          type: string
          minLength: 1
          example: Robert C. Martin
        published_year:
          type: integer
          minimum: 0
          example: 2008

    BookCreate:
      type: object
      description: Dữ liệu client gửi để tạo sách; không gồm id.
      required:
        - title
        - author
        - published_year
      properties:
        title:
          type: string
          minLength: 1
          example: Clean Code
        author:
          type: string
          minLength: 1
          example: Robert C. Martin
        published_year:
          type: integer
          minimum: 0
          example: 2008
      additionalProperties: false

    BookUpdate:
      type: object
      description: Dữ liệu thay thế các trường có thể sửa khi gọi PUT.
      required:
        - title
        - author
        - published_year
      properties:
        title:
          type: string
          minLength: 1
          example: Clean Code - Second Edition
        author:
          type: string
          minLength: 1
          example: Robert C. Martin
        published_year:
          type: integer
          minimum: 0
          example: 2009
      additionalProperties: false

    BookList:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        total:
          type: integer
          minimum: 0
          example: 1

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Book not found

  responses:
    BadRequest:
      description: Request body không hợp lệ hoặc thiếu trường bắt buộc
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Missing required field(s): title, author, published_year"

    NotFound:
      description: Không tìm thấy sách theo ID đã cung cấp
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Book not found

    InternalServerError:
      description: Lỗi không mong muốn từ server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error
